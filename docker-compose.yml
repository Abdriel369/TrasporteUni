services:
  web:
   container_name: phpweb
   ports:
     - "8080:80"
   volumes:
     - ./www:/var/www/html
   depends_on:
     - mysqldb
     - ia
   networks:
     - mi_red
   build:
     context: .
     dockerfile: Dockerfile

  ia:
    container_name: ia_prediccion
    build:
      context: ./Moduelo_IA
      dockerfile: Dockerfile
    ports:
      - "5001:5000"   # 5001 en el host solo para pruebas manuales (curl/Postman)
    networks:
      - mi_red

  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: transporte
      MYSQL_USER: usuario
      MYSQL_PASSWORD: pass1234
    ports:
      - "3307:3306"   # puerto 3307 en host, 3306 dentro del contenedor
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    networks:
      - mi_red

networks:
  mi_red:
    driver: bridge

volumes:
  db_data:
