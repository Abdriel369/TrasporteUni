<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTransporte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row py-3 px-2">
            <div class="col d-flex justify-content-between align-items-center">
                <h1 class="fw-bold mb-0">UniTransporte</h1>
                <span class="material-symbols-rounded" style="color: var(--orange); font-size: 34px;">directions_bus</span>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="hero-card">
            <div class="hero-card-icon-bg">
                <span class="material-symbols-rounded">navigation</span>
            </div>
            <div class="hero-card-text">
                <h2>UniTransporte</h2>
                <p>Publica, empareja y confirma viajes con comunicación clara.</p>
            </div>
        </div>

        <a href="login.html" class="cta-button">
            <span class="material-symbols-rounded">login</span>
            <span>Inicio de Sesión</span>
        </a>
        <div style="height: 10px;"></div>

        <a href="registro.html" class="cta-button orange">
            <span class="material-symbols-rounded">app_registration</span>
            <span>Registro de Usuario</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        // Si ya hay sesión iniciada, saltar directo al menú
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (user) {
                window.location.href = 'menu.html';
            }
        });
    </script>
</body>
</html>
