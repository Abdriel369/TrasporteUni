<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTransporte - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a href="index.html" class="back-button">
                <span class="material-symbols-rounded">arrow_back_ios_new</span>
            </a>
            <span class="title">Registro de Usuario</span>
            <div></div>
        </div>
    </nav>

    <div class="content">
        <div class="field-container">
            <span class="material-symbols-rounded">person</span>
            <input type="text" id="reg-nombre" class="capsule-field capsule-field-with-icon" placeholder="Nombre completo">
        </div>
        <div class="field-container">
            <span class="material-symbols-rounded">alternate_email</span>
            <input type="email" id="reg-correo" class="capsule-field capsule-field-with-icon" placeholder="Correo institucional">
        </div>
        <div class="field-container">
            <span class="material-symbols-rounded">badge</span>
            <input type="text" id="reg-control" class="capsule-field capsule-field-with-icon" placeholder="Número de control">
        </div>
        <div class="field-container">
            <span class="material-symbols-rounded">lock</span>
            <input type="password" id="reg-clave" class="capsule-field capsule-field-with-icon" placeholder="Contraseña (mín. 6)">
        </div>
        <div class="field-container">
            <span class="material-symbols-rounded">verified_user</span>
            <input type="password" id="reg-confirmar" class="capsule-field capsule-field-with-icon" placeholder="Confirmar contraseña">
        </div>

        <div class="section-header">Rol</div>
        <div class="segmented-control">
            <input type="radio" name="rol" id="rol-pasajero" value="Pasajero" checked>
            <label for="rol-pasajero">Pasajero</label>

            <input type="radio" name="rol" id="rol-conductor" value="Conductor">
            <label for="rol-conductor">Conductor</label>
        </div>

        <div style="height: 20px;"></div>

        <a href="#" id="btn-register-submit" class="cta-button">
            <span class="material-symbols-rounded">verified</span>
            <span>Validar y crear cuenta</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
