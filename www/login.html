<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTransporte - Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a href="index.html" class="back-button">
                <span class="material-symbols-rounded">arrow_back_ios_new</span>
            </a>
            <span class="title">Inicio de Sesión</span>
            <div></div>
        </div>
    </nav>

    <div class="content">
        <div class="field-container">
            <span class="material-symbols-rounded">person</span>
            <input type="email" id="login-correo" class="capsule-field capsule-field-with-icon" placeholder="Correo">
        </div>
        <div class="field-container">
            <span class="material-symbols-rounded">lock</span>
            <input type="password" id="login-clave" class="capsule-field capsule-field-with-icon" placeholder="Contraseña">
        </div>

        <div style="height: 10px;"></div>

        <a href="#" id="btn-login-submit" class="cta-button">
            <span class="material-symbols-rounded">login</span>
            <span>Entrar</span>
        </a>

        <div style="height: 14px; text-align:center;">
            <span>¿No tienes cuenta? </span><a href="registro.html">Regístrate</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
